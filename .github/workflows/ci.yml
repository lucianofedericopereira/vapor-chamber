name: CI

on:
  push:
    branches: [main]
    # Files no CI job reads except the ASCII guard in `lint:check`. A push that
    # touches only these runs nothing (the local gate covers the guard); pull
    # requests always run CI.
    paths-ignore:
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer pull request push replaces the older run. A push to main queues: a
# cancelled run could lose its bot commit or stop a Pages deploy halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are split only where the install, the runner or the time budget
# differs. macOS waits for `check`, so it runs only on a head already green on
# Linux and repeats only the build and the tests. Node comes from .node-version
# in every job: V8 shapes are under test, so a Node bump is a deliberate commit.
permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '5'

jobs:
  check:
    # Typecheck, guards, suite under coverage (the floors in vitest.config.ts),
    # Vapor project, size budgets, LOC report. Generated files are regenerated
    # first, so tests read a fresh contract/ and a version bump passes the
    # stamp check. A pull request fails on stale generated files; a push to
    # main commits them instead. The local gate (scripts/gate.mjs) still fails
    # on any drift. `npm ci` builds dist/ through `prepare`.
    name: check (Node 24, ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Everything `npm run docs`, `docs:stamp`, `size:doc` and the coverage
      # report write.
      GENERATED: docs README.md CONTRIBUTING.md ROADMAP.md SECURITY.md examples contract php/src/Contract/Fixture
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - run: npm run typecheck
      - run: npm run docs && npm run docs:stamp
      - name: Generated files are committed (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          git add -N $GENERATED
          if ! git diff --exit-code --stat -- $GENERATED; then
            echo "::error::Generated files are stale. Run 'npm run docs && npm run docs:stamp' and commit the result."
            exit 1
          fi
      - run: npm run lint:check
      - run: npm run test:coverage
      - run: npm run test:vapor
      - run: node scripts/check-size.mjs
      - run: npm run loc

      - name: Commit generated files (push to main)
        # Reuses the coverage run above: docs/COVERAGE.md and the stamped
        # counts come from the same run that gated this push.
        if: github.event_name == 'push'
        run: |
          npm run size:doc
          node scripts/measure-coverage.mjs --md > docs/COVERAGE.md
          npm run docs:stamp

          git add $GENERATED
          if ! git diff --cached --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate generated files [skip ci]"
            # A push that landed meanwhile only needs a rebase. The tests passed,
            # so a refused push warns: the next push regenerates these files.
            for _ in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main || { git rebase --abort; break; }
            done
            echo "::warning::Could not push the generated files. The next push to main regenerates them."
          fi

  macos:
    # The same build, both test projects and the size budgets on macOS, once
    # Linux has passed: what an OS can change is the build and the tests, not
    # the guards. Full suite, no coverage: the floors were gated above.
    name: test (Node 24, macos)
    needs: [check]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - run: npm run test:run
      - run: npm run test:vapor
      - run: node scripts/check-size.mjs

  examples:
    # The example builds, with their workspaces installed: the one job whose
    # install differs. Not in the local gate: an example build belongs to the
    # alignment cycle (scripts/gate.mjs).
    name: examples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:example

  browser:
    # The questions only a browser engine answers: focus (HTML's focus fixup
    # rule), keyboard activation, live regions, the accessibility tree.
    # happy-dom implements none of them. Accessibility is a requirement, and an
    # opt-in suite erodes, so it runs on every push and pull request
    # (docs/accessibility.md, definition of done). Both builds: production is
    # what users ship, development is what they debug.
    name: browser (Chromium, production + development)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      # The headless shell only, with its system libraries. The apt mirrors and
      # the browser download can fail for a moment, so they get three tries.
      - run: |
          for _ in 1 2 3; do
            npx playwright install --with-deps --only-shell chromium && exit 0
            sleep 20
          done
          exit 1
      - run: npm run test:browser
      - run: VC_MODE=development npm run test:browser

  perf-ab:
    # Head against base over the committed workloads (scripts/ab/ci.mjs,
    # docs/V8-RULES.md rule 16). Advisory: a shared VM is noisy, so a reported
    # "slower" shows as a failed job with its report attached but never turns
    # the run red. Skips with a notice when there is no comparable base
    # (scripts/ab/base-ok.sh).
    name: perf A/B vs base (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - name: build base and head, then compare
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No comparable base (see base-ok.sh): skip with the reason, not a
          # silent red.
          if ! why=$(bash scripts/ab/base-ok.sh "$BASE"); then
            echo "::notice title=perf-ab skipped::$why"
            echo "perf-ab skipped: $why" | tee perf-ab.txt
            exit 0
          fi
          # Nothing that reaches a built dist changed, so both arms are the same
          # build and there is nothing to compare.
          if git diff --quiet "$BASE" HEAD -- src scripts/ab package.json package-lock.json .node-version scripts/build.mjs tsconfig.json; then
            echo "::notice title=perf-ab skipped::no source change since $BASE"
            echo "perf-ab skipped: no source change since $BASE" | tee perf-ab.txt
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          bash scripts/ab/build-dists.sh "$RUNNER_TEMP/dists" "$BASE" "$HEAD_SHA"
          node scripts/ab/ci.mjs "$RUNNER_TEMP/dists/$BASE" "$RUNNER_TEMP/dists/$HEAD_SHA" --out="$RUNNER_TEMP/ab-raw" 2>&1 | tee perf-ab.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-ab
          path: |
            perf-ab.txt
            ${{ runner.temp }}/ab-raw
          retention-days: 14

  deploy-docs:
    # Waits for check and macos (not for browser, examples or perf-ab); pushes
    # to main only. Publishes the repository root as the Pages site.
    name: deploy docs
    needs: [check, macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: main

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
