name: CI

on:
  push:
    branches: [main]
    # Files no CI job reads except the ASCII guard in `lint:check`. A push that
    # touches only these runs nothing (the local gate covers the guard); pull
    # requests always run CI.
    paths-ignore:
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each check runs once per event. Every job is its own checkout, so every job
# pays an install (and the `prepare` build); the jobs below are split only
# where an install differs (the example workspaces), a runner differs (the
# Chromium shell) or a budget differs (the A/B's 45 minutes).
#
# macOS runs the full suite too, differentially: its job waits for `check`,
# so the slowest and most expensive runner spends minutes only on a head that
# is already green on Linux, and never repeats the guards, the docs diff or
# the coverage run.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    # One install, every per-checkout check, in this order: typecheck, the
    # guards, the generated docs (docs/api, docs/errors.md, contract/, the PHP
    # fixture: `npm run docs` must leave the tree unchanged), the suite UNDER
    # COVERAGE so the floors in vitest.config.ts gate a pull request and not
    # only a push, the Vapor project, the IIFE size budgets and the LOC report
    # (`npm run loc` reports, it never fails). The local gate (scripts/gate.mjs)
    # runs its steps in another order and adds the docs/BUNDLE-SIZES.md diff
    # and a clean-tree assertion; CI runs neither. The suites that read dist/ fail without
    # it (tests/require-dist.ts); `npm ci` builds it through `prepare`.
    name: check (Node 24, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm run docs
      - run: git add -N docs/api docs/errors.md contract php/src/Contract/Fixture && git diff --exit-code -- docs/api docs/errors.md contract php/src/Contract/Fixture
      - run: npm run test:coverage
      - run: npm run test:vapor
      - run: node scripts/check-size.mjs
      - run: npm run loc

      - name: Auto-update documentation (sizes, coverage, stamps)
        # Reuses the coverage run above: docs/COVERAGE.md and the stamped
        # counts come from the same run that gated this push.
        if: github.event_name == 'push'
        run: |
          npm run size:doc
          node scripts/measure-coverage.mjs --md > docs/COVERAGE.md
          npm run docs:stamp

          PATHS="docs README.md CONTRIBUTING.md ROADMAP.md SECURITY.md examples"
          if ! git diff --exit-code $PATHS; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $PATHS
            git commit -m "docs: auto-update metrics [skip ci]"
            git push
          fi

  macos:
    # The same build, both test projects and the size budgets on macOS, once
    # Linux has passed: what an OS can change is the build and the tests, not
    # the guards. Full suite, no coverage: the floors were gated above.
    name: test (Node 24, macos)
    needs: [check]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - run: npm run test:run
      - run: npm run test:vapor
      - run: node scripts/check-size.mjs

  examples:
    # The example builds, with their workspaces installed: the one job whose
    # install differs. Not in the local gate: an example build belongs to the
    # alignment cycle (scripts/gate.mjs).
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:example

  browser:
    # The questions only a browser engine answers: focus (HTML's focus fixup
    # rule), keyboard activation, live regions, the accessibility tree.
    # happy-dom implements none of them. Accessibility is a requirement, and an
    # opt-in suite erodes, so it runs on every push and pull request
    # (docs/accessibility.md, definition of done). Both builds: production is
    # what users ship, development is what they debug.
    name: browser (Chromium, production + development)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      # The headless shell only, with its system libraries.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: VC_MODE=development npm run test:browser

  bench:
    # A report, not a check: absolute ops/sec from a shared VM are noise, and
    # it compares against nothing. The regression check is `perf-ab` below.
    # Off the pull request path: it runs on a push to main and on demand.
    name: bench (report only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - run: set -o pipefail; npx vitest bench --run tests/perf.bench.ts --reporter=default 2>&1 | tee bench.txt
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench.txt
          retention-days: 14

  perf-ab:
    # Is the head slower than its base on any measured path? Both commits are
    # built (scripts/ab/build-dists.sh) and compared by the process-replicated
    # A/B (scripts/ab/ci.mjs, docs/V8-RULES.md rule 16) over the committed
    # workloads. Fails on a counted "slower", on a run where no control passed
    # (the VM too noisy to measure anything), or on a workload that measured
    # nothing. A "no result" row does not fail. It passes without measuring when
    # there is no comparable base (scripts/ab/base-ok.sh: the branch-creating
    # push, a dropped base, a base on another release, a head whose version is
    # already tagged) or when the head ships the same JavaScript as its base.
    # That comparison is byte for byte on the unminified dist, which keeps
    # JSDoc, so a comment-only change still measures.
    name: perf A/B vs base (fails on a measured regression)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false --include-workspace-root
      - name: build base and head, then compare
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No comparable base (see base-ok.sh): skip with the reason, not a
          # silent red.
          if ! why=$(bash scripts/ab/base-ok.sh "$BASE"); then
            echo "::notice title=perf-ab skipped::$why"
            echo "perf-ab skipped: $why" | tee perf-ab.txt
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          bash scripts/ab/build-dists.sh "$RUNNER_TEMP/dists" "$BASE" "$HEAD_SHA"
          node scripts/ab/ci.mjs "$RUNNER_TEMP/dists/$BASE" "$RUNNER_TEMP/dists/$HEAD_SHA" --out="$RUNNER_TEMP/ab-raw" 2>&1 | tee perf-ab.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-ab
          path: |
            perf-ab.txt
            ${{ runner.temp }}/ab-raw
          retention-days: 14

  deploy-docs:
    # Waits for check and macos (not for browser, examples or perf-ab); pushes
    # to main only. Publishes the repository root as the Pages site.
    name: deploy docs
    needs: [check, macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: main

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
