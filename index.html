<!--
  The shell only. Every word of the reference is fetched from docs/api/*.md at
  view time by assets/docs/api.js - this file is committed and static, and
  `npm run docs` never rewrites it. That split is the point: the generator's
  only output is Markdown, which stays readable in an editor and diffable in a
  pull request, while the presentation lives beside it as ordinary assets
  instead of being re-emitted as hundreds of generated HTML files every run.
-->

      <h2>Entry points</h2>
      <div class="stepper">
        <!--
          Drawn as SVG paths rather than typed as "<" and ">". Those are
          angle brackets, not chevrons: they carry the font's own weight and
          proportions, sit on the text baseline rather than the button's
          centre, and read as punctuation. A stroked path is also the only
          form that stays ASCII under scripts/check-ascii.mjs, which bans the
          typographic arrow set outright.
        -->
        <button id="prev-entry" type="button" title="Previous entry point (left arrow)"
                aria-label="Previous entry point">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" /></svg>
        </button>
        <button id="next-entry" type="button" title="Next entry point (right arrow)"
                aria-label="Next entry point">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" /></svg>
        </button>
      </div>
    </div>
